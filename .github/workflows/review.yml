name: Review

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  remove-ai-reviewed-label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale ai-reviewed label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label ai-reviewed || true

  review-mistral:
    needs:
      - remove-ai-reviewed-label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review pull request (Mistral)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REVIEW_MODEL: ${{ vars.MISTRAL_REVIEW_MODEL || 'mistral-large-latest' }}
        run: node scripts/ai-review.mjs "${{ github.event.pull_request.number }}"

  review-glm:
    needs:
      - remove-ai-reviewed-label
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review pull request (GLM 5.3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REVIEW_MODEL: ${{ vars.GLM_REVIEW_MODEL || 'zai-glm-5-3' }}
        run: node scripts/ai-review.mjs "${{ github.event.pull_request.number }}"

  label-ai-reviewed:
    needs:
      - review-mistral
      - review-glm
    runs-on: ubuntu-latest
    steps:
      - name: Ensure ai-reviewed label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh label list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -qx "ai-reviewed"; then
            gh label create ai-reviewed --repo "$GITHUB_REPOSITORY" --description "Both AI reviews (Mistral and GLM) are posted" --color "5319e7"
          fi

      - name: Add ai-reviewed label to the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --add-label ai-reviewed
