name: review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ai-review.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_ENDPOINT: ${{ vars.REVIEW_ENDPOINT }}
